name: Atualizar dados do Rio Iguaçu

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar dados atuais do repositório privado
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          mkdir -p public
          curl -sf -H "Authorization: token ${PRIVATE_REPO_PAT}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/thiagoiwanko/rioiguacu/contents/public/data.json" -o public/data.json || rm -f public/data.json
          curl -sf -H "Authorization: token ${PRIVATE_REPO_PAT}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/thiagoiwanko/rioiguacu/contents/public/historico_diario.csv" -o public/historico_diario.csv || rm -f public/historico_diario.csv

      - name: Rodar coleta
        env:
          ANA_API_LOGIN: ${{ secrets.ANA_API_LOGIN }}
          ANA_API_SENHA: ${{ secrets.ANA_API_SENHA }}
        run: python scrape.py

      - name: Publicar no repositório privado
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          SRC="$GITHUB_WORKSPACE/public"
          git clone "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/thiagoiwanko/rioiguacu.git" /tmp/rioiguacu-privado
          cd /tmp/rioiguacu-privado
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$SRC/data.json" public/data.json
          cp "$SRC/historico_diario.csv" public/historico_diario.csv
          git add public/data.json public/historico_diario.csv
          if git diff --staged --quiet; then
            exit 0
          fi
          mkdir -p /tmp/coleta_atual
          cp public/data.json /tmp/coleta_atual/
          cp public/historico_diario.csv /tmp/coleta_atual/
          for i in $(seq 1 12); do
            git commit -m "Atualiza dados do Rio Iguaçu" -q || true
            if git push; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/coleta_atual/data.json public/
            cp /tmp/coleta_atual/historico_diario.csv public/
            git add public/data.json public/historico_diario.csv
            sleep $((RANDOM % 10 + 3))
          done
          exit 1

