name: Atualizar dados do Rio Iguaçu

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar dados atuais do repositório privado
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          mkdir -p public/cidades
          for ARQ in data.json historico_diario.csv cidades.json chuva-montante.json cidades/porto-vitoria.json cidades/sao-mateus-do-sul.json cidades/fluviopolis.json; do
            curl -sf -H "Authorization: token ${PRIVATE_REPO_PAT}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/thiagoiwanko/rioiguacu/contents/public/${ARQ}" -o "public/${ARQ}" || rm -f "public/${ARQ}"
          done

      - name: Rodar coleta
        env:
          ANA_API_LOGIN: ${{ secrets.ANA_API_LOGIN }}
          ANA_API_SENHA: ${{ secrets.ANA_API_SENHA }}
        run: python scrape.py

      - name: Rodar coleta das outras cidades
        env:
          ANA_API_LOGIN: ${{ secrets.ANA_API_LOGIN }}
          ANA_API_SENHA: ${{ secrets.ANA_API_SENHA }}
        run: python cidades.py

      - name: Publicar no repositório privado
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          SRC="$GITHUB_WORKSPACE/public"
          git clone "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/thiagoiwanko/rioiguacu.git" /tmp/rioiguacu-privado
          cd /tmp/rioiguacu-privado
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/cidades
          cp "$SRC/data.json" public/data.json
          cp "$SRC/historico_diario.csv" public/historico_diario.csv
          cp "$SRC/cidades.json" public/cidades.json 2>/dev/null || true
          cp "$SRC/chuva-montante.json" public/chuva-montante.json 2>/dev/null || true
          cp "$SRC"/cidades/*.json public/cidades/ 2>/dev/null || true
          git add public/data.json public/historico_diario.csv public/cidades.json public/cidades
          git add public/chuva-montante.json 2>/dev/null || true
          if git diff --staged --quiet; then
            exit 0
          fi
          mkdir -p /tmp/coleta_atual/cidades
          cp public/data.json /tmp/coleta_atual/
          cp public/historico_diario.csv /tmp/coleta_atual/
          cp public/cidades.json /tmp/coleta_atual/ 2>/dev/null || true
          cp public/chuva-montante.json /tmp/coleta_atual/ 2>/dev/null || true
          cp public/cidades/*.json /tmp/coleta_atual/cidades/ 2>/dev/null || true
          for i in $(seq 1 12); do
            git commit -m "Atualiza dados do Rio Iguaçu" -q || true
            if git push; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public/cidades
            cp /tmp/coleta_atual/data.json public/
            cp /tmp/coleta_atual/historico_diario.csv public/
            cp /tmp/coleta_atual/cidades.json public/ 2>/dev/null || true
            cp /tmp/coleta_atual/chuva-montante.json public/ 2>/dev/null || true
            cp /tmp/coleta_atual/cidades/*.json public/cidades/ 2>/dev/null || true
            git add public/data.json public/historico_diario.csv public/cidades.json public/cidades
            git add public/chuva-montante.json 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          exit 1

